
<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<title>HLI-01 Dashboard</title>

<style>

body{
font-family:Arial;
margin:40px;
background:#f4f6f9;
}

h1{
color:#003366;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

img{
max-width:100%;
border:1px solid #ddd;
margin-top:10px;
}

table{
width:100%;
border-collapse:collapse;
}

td{
padding:8px;
border-bottom:1px solid #ddd;
}

</style>

</head>

<body>

<h1>HLI-01 Visualization Dashboard</h1>

<div class="card">

<h2>Experiment Information</h2>

<table>

<tr>
<td><b>Model</b></td>
<td>BiLSTM + Attention</td>
</tr>

<tr>
<td><b>Dataset</b></td>
<td>HLI-01 Dataset</td>
</tr>

<tr>
<td><b>Accuracy</b></td>
<td>98.20%</td>
</tr>

<tr>
<td><b>Macro F1</b></td>
<td>97.80%</td>
</tr>

</table>

</div>

<div class="card">

<h2>Training Curves</h2>

<img src="../figures/loss_curve.png">

<img src="../figures/accuracy_curve.png">

</div>

<div class="card">

<h2>Confusion Matrix</h2>

<img src="../confusion_matrix/confusion_matrix.png">

</div>

<div class="card">

<h2>Classification Metrics</h2>

<img src="../metrics/classification_metrics.png">

</div>

<div class="card">

<h2>Prediction Summary</h2>

<iframe
src="../predictions/prediction_summary.txt"
width="100%"
height="160">
</iframe>

</div>

<div class="card">

<h2>Experiment Report</h2>

<a href="../reports/experiment_report.pdf">
Open PDF Report
</a>

</div>

</body>
</html>
